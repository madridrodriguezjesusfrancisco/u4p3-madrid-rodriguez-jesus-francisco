{% extends 'core/base.html' %}

{% block titulo %}Editar categoría{% endblock %}

{% block contenido %}
  <h1 class="text-2xl font-bold mb-4">Editar categoría</h1>

  <form method="POST" class="space-y-4 max-w-md">
    {% csrf_token %}
    {{ form.as_p }}

    <button
      type="submit"
      class="w-auto bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-lg"
    >
      Guardar
    </button>

    <a href="{% url 'categorias' %}" class="ml-3 text-slate-600 underline">
      Cancelar
    </a>
  </form>
{% endblock %}
